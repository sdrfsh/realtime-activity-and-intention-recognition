[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-activity-and-intention-recognition"
version = "0.1.0"
description = "Real-time embedded human activity recognition via adaptive motion-image encoding and a shallow AlexNet."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "keras>=3",
    "jax",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "app"]

[tool.setuptools.packages.find]
where = ["src"]
